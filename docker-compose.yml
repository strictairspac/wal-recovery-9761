name: ${COMPOSE_PROJECT_NAME:-wal-recovery}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wal-recovery}-db
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recovery_local_password}
    ports: ["${DB_PORT:-17746}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wal-recovery}-redis
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-wal-recovery}-backend
    environment: &env
      DATABASE_URL: postgresql+psycopg://recovery:${DB_PASSWORD:-recovery_local_password}@db/recovery
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-wal-recovery-secret-change-before-sharing-2026}
      SEED_DEMO: ${SEED_DEMO:-true}
    command: sh -c 'python -m scripts.seed_demo && uvicorn src.main:app --host 0.0.0.0 --port 8000'
    ports: ["${BACKEND_PORT:-19246}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-wal-recovery}-worker
    environment: *env
    command: python -m src.worker
    volumes: ["artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-pathlib.Path('/tmp/heartbeat').stat().st_mtime<20"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-wal-recovery}-frontend
    ports: ["${FRONTEND_PORT:-18246}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
